name: Add Raydar to portfolio homepage

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-raydar-homepage.yml'

permissions:
  contents: write

jobs:
  patch-homepage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Insert Raydar featured project
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          html = path.read_text()

          marker = 'data-project="raydar"'
          if marker in html:
              print('Raydar card already present; no changes needed.')
              raise SystemExit(0)

          css = '''
          <style id="raydar-project-styles">
            .project-stage + .project-stage{margin-top:clamp(5rem,9vw,8rem)}
            .raydar-stage .project-visual{background:#15192c;box-shadow:14px 16px 0 rgba(221,235,114,.55)}
            .raydar-stage .project-visual::before{content:"LIVE / DECISION INTELLIGENCE"}
            .raydar-stage .project-copy{box-shadow:10px 12px 0 var(--cornflower)}
            .raydar-preview{position:absolute;inset:52px 16px 16px;width:calc(100% - 32px);height:calc(100% - 68px);border:0;border-radius:20px;background:#fff;pointer-events:none}
            .raydar-stage .project-badge{background:var(--cornflower);color:#fff}
            @media (max-width:800px){.raydar-preview{position:relative;inset:auto;width:100%;height:520px;margin-top:38px}}
          </style>
          '''
          html = html.replace('</head>', css + '\n</head>', 1)

          card = r'''

      <article class="project-stage raydar-stage" data-project="raydar">
        <div class="project-visual">
          <iframe class="raydar-preview" src="https://raydar-demo.vercel.app/" title="Raydar commerce intelligence demo preview" loading="lazy" tabindex="-1" aria-hidden="true"></iframe>
          <div class="project-badge">Code calculates · AI interprets · Humans decide</div>
        </div>

        <div class="project-copy">
          <div class="project-tag">02 / Featured system · 2026</div>
          <h3>Raydar <span>Commerce Intelligence</span></h3>
          <p>An AI-assisted product decision system built from a real commerce workflow. Raydar turns fragmented market signals into structured evidence, scored opportunities, decision briefs, and a human-controlled path from research to launch and performance learning.</p>

          <div class="principles">
            <div class="principle"><b>01</b><div><strong>Evidence before recommendation.</strong><span>Signals are normalized and scored with explicit dimensions instead of relying on opaque AI judgment.</span></div></div>
            <div class="principle"><b>02</b><div><strong>AI supports the decision.</strong><span>Deterministic scoring creates the foundation; AI can interpret context, while the owner keeps approval authority.</span></div></div>
            <div class="principle"><b>03</b><div><strong>Built with a privacy boundary.</strong><span>The public portfolio demo uses synthetic, sanitized data while the private operating system retains real business intelligence and workflows.</span></div></div>
          </div>

          <div class="stack">
            <span class="chip">Next.js</span><span class="chip">TypeScript</span><span class="chip">React</span><span class="chip">Decision systems</span><span class="chip">AI workflows</span><span class="chip">Vercel</span>
          </div>
          <div class="project-actions">
            <a class="btn btn-dark" href="https://raydar-demo.vercel.app/" target="_blank" rel="noopener">Launch live demo ↗</a>
            <a class="btn btn-light" href="raydar.html">View case study →</a>
            <a class="btn btn-light" href="https://github.com/rbeecham1076/raydar-demo" target="_blank" rel="noopener">View code ↗</a>
          </div>
        </div>
      </article>'''

          start = html.find('<article class="project-stage">')
          if start == -1:
              raise SystemExit('Could not find the existing Selected Work project card.')
          end = html.find('</article>', start)
          if end == -1:
              raise SystemExit('Could not find the end of the existing project card.')
          end += len('</article>')
          html = html[:end] + card + html[end:]

          path.write_text(html)
          print('Inserted Raydar featured project card.')
          PY

      - name: Commit homepage update
        run: |
          if git diff --quiet; then
            echo "No homepage changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Feature Raydar on portfolio homepage"
          git push
